<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0096fa" />
  <title>OtakuManager</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://accounts.google.com/gsi/client" async></script>
</head>
<body>
  <header class="top">
    <b id="topTitle">OtakuManager</b>
    <input id="search" type="search" placeholder="검색" />
    <button id="refreshBtn" type="button" title="새로 불러오기">↻</button>
  </header>

  <main id="main">
    <section id="login" class="center" hidden>
      <img src="icon.png" alt="" width="72" height="72" />
      <h2>OtakuManager</h2>
      <p id="loginMsg" class="muted"></p>
      <button id="loginBtn" type="button" class="primary">구글 계정으로 보기</button>
    </section>

    <section id="view-library" class="view">
      <div id="shelves" class="chips"></div>
      <ul id="libList" class="list"></ul>
    </section>
    <section id="view-scraps" class="view" hidden>
      <div id="scrapGenres" class="chips"></div>
      <ul id="scrapList" class="list"></ul>
    </section>
    <section id="view-gallery" class="view" hidden>
      <div id="galPath" class="path"></div>
      <div id="galGrid" class="grid"></div>
      <div id="galMore" class="center muted" hidden>더 불러오는 중…</div>
    </section>
    <p id="status" class="center muted"></p>
  </main>

  <nav class="tabs">
    <button type="button" data-view="library" class="on">서재</button>
    <button type="button" data-view="scraps">스크랩</button>
    <button type="button" data-view="gallery">그림</button>
  </nav>

  <!-- 작품 읽기 -->
  <div id="reader" class="sheet" hidden>
    <header class="sheet-head">
      <button type="button" class="back">←</button>
      <b id="rTitle"></b>
      <select id="rMode">
        <option value="tr">번역</option>
        <option value="orig">원문</option>
        <option value="both">나란히</option>
      </select>
    </header>
    <div class="sheet-body">
      <div id="rMeta" class="muted"></div>
      <select id="rChapter"></select>
      <article id="rText"></article>
      <div class="rnav"><button type="button" id="rPrev">이전 장</button><button type="button" id="rNext">다음 장</button></div>
    </div>
  </div>

  <!-- 스크랩 글 -->
  <div id="scrapView" class="sheet" hidden>
    <header class="sheet-head">
      <button type="button" class="back">←</button>
      <b id="sTitle"></b>
    </header>
    <iframe id="sFrame" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
  </div>

  <!-- 그림 크게 -->
  <div id="photo" class="sheet dark" hidden>
    <header class="sheet-head">
      <button type="button" class="back">←</button>
      <b id="pName"></b>
    </header>
    <div id="pBox" class="photo-box"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
